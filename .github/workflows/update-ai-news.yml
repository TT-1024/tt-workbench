name: Update daily AI news

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-ai-news.yml'
      - 'scripts/update-ai-news.mjs'
  schedule:
    # 07:30 Asia/Shanghai: primary run
    - cron: '30 23 * * *'
    # 09:30 Asia/Shanghai: retry if the primary run failed
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore existing data and rebuild yesterday briefing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build yesterday AI briefing
        run: node scripts/update-ai-news.mjs ${{ inputs.force && '--force' || '' }}
      - name: Save updated briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-news.json
          if ! git diff --cached --quiet; then
            git commit -m "自动更新昨日 AI 快报"
            git pull --rebase
            git push
          fi
