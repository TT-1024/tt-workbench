<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dce8f8">
  <title>TT工作台·更新中</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #182033;
      background: radial-gradient(circle at 15% 15%, #fff, transparent 32%),
        radial-gradient(circle at 85% 85%, #d7bcff, transparent 36%),
        linear-gradient(145deg, #dceaff, #f5eaf6 70%, #e2f4ee);
    }
    .card {
      width: min(86vw, 360px); padding: 34px; text-align: center;
      border: 1px solid rgba(255,255,255,.85); border-radius: 28px;
      background: rgba(255,255,255,.48); backdrop-filter: blur(30px) saturate(180%);
      box-shadow: 0 24px 70px rgba(55,70,106,.16), inset 0 1px 0 #fff;
    }
    .spinner {
      width: 38px; height: 38px; margin: 0 auto 18px; border-radius: 50%;
      border: 3px solid rgba(0,122,255,.15); border-top-color: #007aff;
      animation: spin .8s linear infinite;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: rgba(24,32,51,.62); font-size: 14px; line-height: 1.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>正在更新工作台</h1>
    <p>只清理旧网页缓存，不会删除你的记录和照片。</p>
  </div>
  <script>
    (async function() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('tt-workbench-')).map(key => caches.delete(key)));
        }
      } catch (error) {
        console.warn('Cache migration warning:', error);
      }
      location.replace('./?refreshed=' + Date.now());
    })();
  </script>
</body>
</html>
